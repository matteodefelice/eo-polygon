# Area and period -------------------------------------------------------------
polygon: "POLYGON((10.0500 45.1500, 10.0562 45.1496, 10.0570 45.1538, 10.0506 45.1544, 10.0500 45.1500))"  # WKT, EPSG:4326 (lon lat)
time: ["2024-04-01", "2024-10-01"]   # start included, end excluded
output_dir: data

# Accounts (no tokens here: both libraries cache them in the user profile) -----
openeo:
  url: openeo.dataspace.copernicus.eu
  account: matteo.de.felice@rabobank.com   # Copernicus Data Space username, for reference only
gee:
  project: ""          # Google Cloud project registered for Earth Engine
  account: ""          # Google account, for reference only
  url: https://earthengine-highvolume.googleapis.com

# Sources ---------------------------------------------------------------------
# resolution is in degrees (output grid is EPSG:4326): 0.0001 ~ 10 m, 0.0003 ~ 30 m
sentinel2:
  resolution: 0.0001
  scl_cloud: [0, 1, 3, 8, 9, 10, 11]   # SCL classes treated as unusable
  openeo:
    collection: SENTINEL2_L2A
    bands: {red: B04, nir: B08, scl: SCL}
  gee:
    collection: [COPERNICUS/S2_SR_HARMONIZED]
    bands: {red: B4, nir: B8, scl: SCL}

landsat:
  resolution: 0.0003
  scale: 0.00341802                    # ST_B10 digital number -> kelvin
  offset: 149.0
  qa_cloud_bits: [1, 2, 3, 4]          # QA_PIXEL: dilated cloud, cirrus, cloud, shadow
  openeo:
    stac: https://planetarycomputer.microsoft.com/api/stac/v1/collections/landsat-c2-l2
    bands: {st: lwir11, qa: qa_pixel}
  gee:
    collection: [LANDSAT/LC08/C02/T1_L2, LANDSAT/LC09/C02/T1_L2]
    bands: {st: ST_B10, qa: QA_PIXEL}
